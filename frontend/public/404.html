<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Page not found | Fried Schölvinck</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8fb">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111319">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("fried:theme");
          if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="content" class="page standalone">
      <section class="missing">
        <a class="brand" href="/">
          <img class="brand-mark" src="/icons/icon.svg" alt="" width="24" height="24">
          <span>Fried Schölvinck</span>
        </a>
        <p class="eyebrow">404</p>
        <h1 class="hero-title">Page not found</h1>
        <p class="lede">That address is not on this site.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/">Back home</a>
          <a class="btn" href="/#blog">Writing</a>
        </div>
      </section>
    </main>
  </body>
</html>
