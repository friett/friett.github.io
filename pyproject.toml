[project]
name = "friett"
version = "0.1.0"
description = "Personal site of Fried Schölvinck"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.14.0",
    "python-frontmatter>=1.3.0",
    "sqlmodel>=0.0.48",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
# Blog posts are prose; leave their code samples as written.
extend-exclude = ["content"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "FAST"]

[tool.ruff.lint.per-file-ignores]
# The model prompts are prose; wrapping them would change what the model reads.
"app/chat.py" = ["E501"]
"app/suggest.py" = ["E501"]
