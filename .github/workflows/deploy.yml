name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      # The /ask and /admin islands. FastAPI Cloud does not build them, so they are built
      # here and uploaded with the app (.fastapicloudignore keeps them).
      - name: Build the frontend islands
        working-directory: frontend/app
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - name: Deploy to FastAPI Cloud
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
